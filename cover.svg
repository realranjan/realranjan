<svg viewBox="0 0 1000 340" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0d" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="50%" stop-color="#e5e5e5" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <style>
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, sans-serif;
      }
      .mono {
        font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace;
      }
      .title {
        font-size: 44px;
        font-weight: 600;
        fill: #f5f5f7;
        letter-spacing: -1.5px;
      }
      .subtitle {
        font-size: 16px;
        font-weight: 400;
        fill: #86868b;
        letter-spacing: -0.2px;
      }
      .meta {
        font-size: 11px;
        fill: #6e6e73;
        letter-spacing: 1.5px;
      }
      .dot {
        fill: #30d158;
        animation: pulse 3s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1000" height="340" rx="14" fill="url(#bg)" stroke="#1f1f1f" stroke-width="1.5" />

  <!-- Subtle Dot Matrix Grid -->
  <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="0.75" fill="#262626" />
  </pattern>
  <rect width="1000" height="340" rx="14" fill="url(#dots)" />

  <!-- Kinetic Morphing Topographic Waves (Pure Native SMIL Animation - Never Blocked by GitHub) -->
  <g fill="none" stroke="url(#lineGrad)" stroke-width="1.2">
    <path>
      <animate attributeName="d" dur="12s" repeatCount="indefinite"
        values="M 350,340 C 520,260 640,320 1000,120;
                M 350,340 C 560,310 680,180 1000,160;
                M 350,340 C 520,260 640,320 1000,120" />
    </path>
    <path>
      <animate attributeName="d" dur="14s" repeatCount="indefinite"
        values="M 300,340 C 490,230 650,290 1000,90;
                M 300,340 C 540,290 690,150 1000,130;
                M 300,340 C 490,230 650,290 1000,90" />
    </path>
    <path stroke="url(#accentGrad)" stroke-width="1.5">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M 250,340 C 460,200 660,260 1000,60;
                M 250,340 C 510,270 700,120 1000,100;
                M 250,340 C 460,200 660,260 1000,60" />
    </path>
    <path>
      <animate attributeName="d" dur="16s" repeatCount="indefinite"
        values="M 200,340 C 430,170 670,230 1000,30;
                M 200,340 C 480,250 710,90 1000,70;
                M 200,340 C 430,170 670,230 1000,30" />
    </path>
    <path>
      <animate attributeName="d" dur="18s" repeatCount="indefinite"
        values="M 150,340 C 400,140 680,200 1000,0;
                M 150,340 C 450,230 720,60 1000,40;
                M 150,340 C 400,140 680,200 1000,0" />
    </path>
  </g>

  <!-- Left Content Column -->
  <g transform="translate(56, 64)">
    <!-- Status Indicator -->
    <circle cx="6" cy="-4" r="4" class="dot" />
    <text x="20" y="0" class="mono meta">AVAILABLE FOR PROJECTS</text>

    <!-- Main Name & Role -->
    <text x="0" y="68" class="sans title">Alex Mercer</text>
    <text x="0" y="104" class="sans subtitle">Software Engineer &amp; Interface Designer</text>
    <text x="0" y="130" class="sans subtitle">Building fast, tactile web applications and developer tools.</text>

    <!-- Minimalist Pill Tags (Pure SVG) -->
    <g transform="translate(0, 172)">
      <rect x="0" y="0" width="96" height="28" rx="6" fill="#141414" stroke="#262626" />
      <text x="48" y="18" text-anchor="middle" class="mono" font-size="11" fill="#d4d4d8">TypeScript</text>

      <rect x="106" y="0" width="68" height="28" rx="6" fill="#141414" stroke="#262626" />
      <text x="140" y="18" text-anchor="middle" class="mono" font-size="11" fill="#d4d4d8">React</text>

      <rect x="184" y="0" width="76" height="28" rx="6" fill="#141414" stroke="#262626" />
      <text x="222" y="18" text-anchor="middle" class="mono" font-size="11" fill="#d4d4d8">Next.js</text>

      <rect x="270" y="0" width="64" height="28" rx="6" fill="#141414" stroke="#262626" />
      <text x="302" y="18" text-anchor="middle" class="mono" font-size="11" fill="#d4d4d8">Node</text>

      <rect x="344" y="0" width="60" height="28" rx="6" fill="#141414" stroke="#262626" />
      <text x="374" y="18" text-anchor="middle" class="mono" font-size="11" fill="#d4d4d8">Rust</text>
    </g>
  </g>
</svg>
