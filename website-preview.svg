<svg viewBox="0 0 900 420" width="100%" height="420" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&amp;family=Inter:wght@400;500;600&amp;display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        .browser {
          width: 900px;
          height: 420px;
          background: #07070c;
          border: 1.5px solid #1e293b;
          border-radius: 20px;
          overflow: hidden;
          font-family: 'Inter', sans-serif;
          color: #f8fafc;
          position: relative;
          display: flex;
          flex-direction: column;
        }

        /* Fake Browser Top Bar */
        .topbar {
          height: 44px;
          background: rgba(15, 16, 26, 0.9);
          border-bottom: 1px solid #1e293b;
          display: flex;
          align-items: center;
          padding: 0 20px;
          justify-content: space-between;
        }
        .dots { display: flex; gap: 8px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .r { background: #ef4444; } .y { background: #f59e0b; } .g { background: #10b981; }
        
        .url-bar {
          background: #07070c;
          border: 1px solid #1e293b;
          border-radius: 8px;
          padding: 4px 80px;
          font-size: 12px;
          color: #94a3b8;
          display: flex;
          align-items: center;
          gap: 6px;
        }

        /* Animated Background Mesh */
        .glow {
          position: absolute;
          width: 350px;
          height: 350px;
          background: radial-gradient(circle, rgba(99,102,241,0.35) 0%, rgba(236,72,153,0.15) 50%, transparent 70%);
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          filter: blur(40px);
          animation: pulseGlow 6s infinite alternate ease-in-out;
          z-index: 0;
        }

        /* Mini Website Navbar */
        .nav {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 20px 40px;
          z-index: 2;
        }
        .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 18px; letter-spacing: -0.5px; }
        .nav-links { display: flex; gap: 24px; font-size: 13px; color: #94a3b8; }
        .cta-btn {
          background: linear-gradient(135deg, #6366f1, #ec4899);
          padding: 8px 18px;
          border-radius: 99px;
          font-size: 12px;
          font-weight: 600;
          color: white;
          box-shadow: 0 0 20px rgba(99,102,241,0.5);
          animation: floatBtn 3s ease-in-out infinite alternate;
        }

        /* Website Hero Body */
        .hero {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          z-index: 2;
          padding: 0 40px;
        }
        .pill {
          border: 1px solid rgba(255,255,255,0.15);
          background: rgba(255,255,255,0.03);
          padding: 6px 16px;
          border-radius: 99px;
          font-size: 11px;
          letter-spacing: 2px;
          text-transform: uppercase;
          color: #06b6d4;
          margin-bottom: 16px;
        }
        .h1 {
          font-family: 'Syne', sans-serif;
          font-size: 42px;
          font-weight: 800;
          line-height: 1.1;
          background: linear-gradient(to right, #ffffff, #94a3b8);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          margin-bottom: 14px;
        }
        .p { color: #94a3b8; font-size: 14px; max-width: 520px; margin-bottom: 24px; }

        /* Infinite Scrolling Marquee inside SVG! */
        .marquee-wrap {
          width: 100%;
          background: rgba(255,255,255,0.02);
          border-top: 1px solid #1e293b;
          padding: 12px 0;
          overflow: hidden;
          white-space: nowrap;
          z-index: 2;
        }
        .marquee {
          display: inline-block;
          animation: scroll 18s linear infinite;
          font-family: 'Syne', sans-serif;
          font-size: 12px;
          letter-spacing: 3px;
          color: #64748b;
        }
        .marquee span { color: #ec4899; margin: 0 18px; }

        @keyframes scroll {
          0% { transform: translateX(0%); }
          100% { transform: translateX(-50%); }
        }
        @keyframes pulseGlow {
          0% { transform: translate(-50%, -50%) scale(0.9); }
          100% { transform: translate(-50%, -50%) scale(1.25); }
        }
        @keyframes floatBtn {
          0% { transform: translateY(0px); }
          100% { transform: translateY(-3px); }
        }
      </style>

      <div class="browser">
        <div class="glow"></div>
        
        <!-- Browser Chrome -->
        <div class="topbar">
          <div class="dots">
            <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
          </div>
          <div class="url-bar">🔒 https://your-username.github.io — Click to Launch Full Experience</div>
          <div style="width: 40px;"></div>
        </div>

        <!-- Embedded Website UI -->
        <div class="nav">
          <div class="logo">STUDIO.DEV</div>
          <div class="nav-links">
            <span>Work</span><span>Lab</span><span>Shaders</span><span>About</span>
          </div>
          <div class="cta-btn">Launch Interactive Site ↗</div>
        </div>

        <div class="hero">
          <div class="pill">✦ Interactive WebGL Portfolio</div>
          <div class="h1">EXPERIENCE THE FULL<br/>PORTFOLIO WEBSITE</div>
          <div class="p">Click anywhere on this window to open my live, interactive portfolio hosted directly on GitHub Pages with 3D physics and custom cursors.</div>
        </div>

        <!-- Infinite CSS Marquee -->
        <div class="marquee-wrap">
          <div class="marquee">
            CREATIVE DEVELOPMENT <span>✦</span> NEXT.JS &amp; WEBGL <span>✦</span> DESIGN SYSTEMS <span>✦</span> FULL-STACK ARCHITECTURE <span>✦</span> CREATIVE DEVELOPMENT <span>✦</span> NEXT.JS &amp; WEBGL <span>✦</span> DESIGN SYSTEMS <span>✦</span> FULL-STACK ARCHITECTURE <span>✦</span>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
