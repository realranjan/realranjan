<svg viewBox="0 0 900 320" width="100%" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&amp;family=Inter:wght@400;500;600&amp;display=swap');

      .bg { fill: #07070c; }
      .grid { stroke: rgba(255, 255, 255, 0.03); stroke-width: 1; }
      
      .title {
        font-family: 'Syne', sans-serif;
        font-weight: 800;
        font-size: 56px;
        fill: url(#text-grad);
        letter-spacing: -1.5px;
      }

      .subtitle {
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        font-size: 16px;
        fill: #94a3b8;
        letter-spacing: 5px;
        text-transform: uppercase;
        animation: fadeIn 2s ease-out;
      }

      .badge-bg {
        fill: rgba(255, 255, 255, 0.03);
        stroke: rgba(255, 255, 255, 0.1);
        stroke-width: 1;
        rx: 20px;
      }

      .badge-text {
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #e2e8f0;
        letter-spacing: 1px;
      }

      .orb-1 {
        fill: url(#orb-grad-1);
        filter: blur(50px);
        animation: float1 10s ease-in-out infinite alternate;
        transform-origin: center;
      }

      .orb-2 {
        fill: url(#orb-grad-2);
        filter: blur(60px);
        animation: float2 14s ease-in-out infinite alternate;
        transform-origin: center;
      }

      .scanline {
        stroke: url(#line-grad);
        stroke-width: 2;
        opacity: 0.7;
        animation: scan 6s ease-in-out infinite alternate;
      }

      .status-dot {
        fill: #10b981;
        animation: pulse 2s infinite;
      }

      @keyframes float1 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(120px, 40px) scale(1.2); }
      }
      @keyframes float2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-120px, -40px) scale(1.3); }
      }
      @keyframes scan {
        0% { transform: translateY(30px); }
        100% { transform: translateY(290px); }
      }
      @keyframes pulse {
        0% { opacity: 1; filter: drop-shadow(0 0 2px #10b981); }
        50% { opacity: 0.3; filter: drop-shadow(0 0 8px #10b981); }
        100% { opacity: 1; filter: drop-shadow(0 0 2px #10b981); }
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <radialGradient id="orb-grad-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orb-grad-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="1" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" class="grid" />
    </pattern>
  </defs>

  <!-- Main Background -->
  <rect width="900" height="320" rx="24" class="bg" stroke="#1e293b" stroke-width="2" />
  
  <!-- Animated Glowing Orbs -->
  <circle cx="250" cy="120" r="160" class="orb-1" />
  <circle cx="650" cy="200" r="180" class="orb-2" />
  
  <!-- Cyberpunk Grid Overlay -->
  <rect width="900" height="320" rx="24" fill="url(#grid)" />

  <!-- Animated Laser Scanline -->
  <line x1="0" y1="0" x2="900" y2="0" class="scanline" />

  <!-- Top Pill Badge -->
  <g transform="translate(345, 55)">
    <rect width="210" height="34" class="badge-bg" />
    <circle cx="22" cy="17" r="5" class="status-dot" />
    <text x="115" y="21" text-anchor="middle" class="badge-text">AVAILABLE FOR WORK</text>
  </g>

  <!-- Main Typography -->
  <text x="450" y="165" text-anchor="middle" class="title">YOUR NAME HERE</text>
  <text x="450" y="215" text-anchor="middle" class="subtitle">CREATIVE DEVELOPER &amp; UI ARCHITECT</text>

  <!-- Bottom Decorative UI Elements -->
  <g transform="translate(40, 275)" opacity="0.4">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#94a3b8">// SYS.VER: 2026.9</text>
    <text x="720" y="0" font-family="monospace" font-size="11" fill="#94a3b8">LATENCY: 12ms</text>
  </g>
</svg>
