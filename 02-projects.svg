<svg viewBox="0 0 1000 680" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');

      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .serif { font-family: 'Instrument Serif', 'Playfair Display', Georgia, 'Times New Roman', serif; font-style: italic; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }

      .bg { fill: #0b0b0a; }
      .card { fill: #121210; stroke: #242320; stroke-width: 1; }
      .mockup-bg { fill: #090908; stroke: #22211e; stroke-width: 1; }
      
      .bone { fill: #f2efe9; }
      .stone { fill: #8a857d; }
      .muted { fill: #57534e; }
      .accent { fill: #e04f33; }
      .tag-bg { fill: #181815; stroke: #292824; stroke-width: 1; }

      /* Mockup 1: Command Palette Selection Animation */
      .cmd-selector {
        animation: selectRow 4.5s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      @keyframes selectRow {
        0%, 25% { transform: translateY(0px); }
        35%, 60% { transform: translateY(32px); }
        70%, 90% { transform: translateY(64px); }
        100% { transform: translateY(0px); }
      }

      /* Mockup 2: Telemetry Scanner */
      .scan-bar {
        animation: scanX 5s ease-in-out infinite alternate;
      }
      @keyframes scanX {
        0% { transform: translateX(0px); }
        100% { transform: translateX(260px); }
      }

      /* Mockup 3: Token Slider Animation */
      .slider-1 { animation: slide1 4s ease-in-out infinite alternate; }
      .slider-2 { animation: slide2 3.2s ease-in-out infinite alternate; }
      @keyframes slide1 { from { transform: translateX(0px); } to { transform: translateX(85px); } }
      @keyframes slide2 { from { transform: translateX(60px); } to { transform: translateX(-20px); } }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect width="1000" height="680" rx="12" class="bg" stroke="#242320" stroke-width="1" />

  <!-- Section Header -->
  <g transform="translate(36, 42)">
    <text x="0" y="0" class="mono accent" font-size="11" letter-spacing="2">01 / SELECTED WORKS</text>
    <text x="180" y="0" class="mono muted" font-size="11">— PRODUCTION ARCHIVE (2023–2026)</text>
    <text x="928" y="0" text-anchor="end" class="mono stone" font-size="11">INDEX [01—03]</text>
  </g>
  <line x1="0" y1="62" x2="1000" y2="62" stroke="#242320" />

  <!-- ==================== CASE STUDY 01 (FULL WIDTH FEATURE) ==================== -->
  <g transform="translate(32, 86)">
    <rect width="936" height="260" rx="10" class="card" />

    <!-- Left Metadata & Story -->
    <g transform="translate(32, 36)">
      <text x="0" y="0" class="serif accent" font-size="24">01</text>
      <text x="32" y="-3" class="mono stone" font-size="10" letter-spacing="1.5">/ [2026] — LEAD ENGINEER &amp; DESIGNER</text>

      <text x="0" y="40" class="sans bone" font-size="26" font-weight="600" letter-spacing="-0.8">[Project Title 01 — e.g. Raycast / Command Engine]</text>
      
      <text x="0" y="72" class="sans stone" font-size="13.5">
        [Placeholder: A zero-latency keyboard command center and real-time search index
      </text>
      <text x="0" y="92" class="sans stone" font-size="13.5">
        engineered for power users. Features fuzzy AST matching, spring transitions,
      </text>
      <text x="0" y="112" class="sans stone" font-size="13.5">
        and a plugin runtime executing in isolated WebWorkers.]
      </text>

      <!-- Impact Metric -->
      <text x="0" y="146" class="mono bone" font-size="11">✦ IMPACT: <tspan class="stone">[Sub-8ms search latency across 500k+ indexed nodes]</tspan></text>

      <!-- Tech Stack Pills -->
      <g transform="translate(0, 166)">
        <rect x="0" y="0" width="84" height="24" rx="4" class="tag-bg" />
        <text x="42" y="15.5" text-anchor="middle" class="mono stone" font-size="10">TypeScript</text>

        <rect x="92" y="0" width="60" height="24" rx="4" class="tag-bg" />
        <text x="122" y="15.5" text-anchor="middle" class="mono stone" font-size="10">React</text>

        <rect x="160" y="0" width="56" height="24" rx="4" class="tag-bg" />
        <text x="188" y="15.5" text-anchor="middle" class="mono stone" font-size="10">Rust</text>

        <rect x="224" y="0" width="90" height="24" rx="4" class="tag-bg" />
        <text x="269" y="15.5" text-anchor="middle" class="mono stone" font-size="10">WebWorkers</text>
      </g>
    </g>

    <!-- Right Animated UI Mockup: Command Palette App -->
    <g transform="translate(520, 24)">
      <rect width="390" height="212" rx="8" class="mockup-bg" />
      <!-- Window Header / Search Input -->
      <line x1="0" y1="40" x2="390" y2="40" stroke="#1f1e1b" />
      <circle cx="20" cy="20" r="4" fill="#e04f33" />
      <text x="36" y="24" class="mono bone" font-size="11">&gt; deploy production --edge</text>
      <rect x="212" y="13" width="6" height="14" fill="#e04f33">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>
      <text x="340" y="24" class="mono muted" font-size="9">ESC</text>

      <!-- Animated Highlight Bar -->
      <g transform="translate(12, 52)">
        <rect class="cmd-selector" x="0" y="0" width="366" height="28" rx="5" fill="#1b1a17" stroke="#33312b" />
        
        <!-- Row 1 -->
        <text x="12" y="18" class="sans bone" font-size="11.5" font-weight="500">Deploy to Global Edge Network</text>
        <text x="305" y="18" class="mono accent" font-size="9.5">⌘ + ENTER</text>

        <!-- Row 2 -->
        <text x="12" y="50" class="sans stone" font-size="11.5">Inspect Distributed Worker Logs</text>
        <text x="320" y="50" class="mono muted" font-size="9.5">⌘ + L</text>

        <!-- Row 3 -->
        <text x="12" y="82" class="sans stone" font-size="11.5">Purge CDN Cache &amp; Revalidate</text>
        <text x="320" y="82" class="mono muted" font-size="9.5">⌘ + K</text>

        <!-- Status Footer inside Mockup -->
        <line x1="-12" y1="124" x2="378" y2="124" stroke="#1f1e1b" />
        <text x="4" y="144" class="mono muted" font-size="9.5">INDEXED: 142,890 SYMBOLS</text>
        <text x="275" y="144" class="mono stone" font-size="9.5">LATENCY: 1.8ms</text>
      </g>
    </g>
  </g>

  <!-- ==================== CASE STUDY 02 (BOTTOM LEFT) ==================== -->
  <g transform="translate(32, 368)">
    <rect width="456" height="284" rx="10" class="card" />

    <!-- Top Animated UI Mockup: Telemetry Engine -->
    <g transform="translate(20, 20)">
      <rect width="416" height="115" rx="6" class="mockup-bg" />
      <text x="14" y="20" class="mono muted" font-size="9.5">THROUGHPUT // 84,200 REQ/S</text>
      <circle cx="396" cy="16" r="3" fill="#28c840" />

      <!-- Animated Telemetry Area Curve -->
      <path d="M 15,90 Q 75,40 130,75 T 250,45 T 360,65 L 400,35" fill="none" stroke="#e04f33" stroke-width="1.8" />
      <path d="M 15,95 Q 95,70 160,85 T 280,65 T 400,55" fill="none" stroke="#57534e" stroke-width="1.2" stroke-dasharray="3 3" />

      <!-- Scanning Vertical Cursor -->
      <g class="scan-bar" transform="translate(60, 0)">
        <line x1="0" y1="28" x2="0" y2="105" stroke="#f2efe9" stroke-width="1" stroke-dasharray="2 2" />
        <circle cx="0" cy="62" r="3.5" fill="#e04f33" />
        <rect x="6" y="34" width="54" height="16" rx="3" fill="#181815" stroke="#2d2c28" />
        <text x="33" y="45" text-anchor="middle" class="mono bone" font-size="8.5">99.98%</text>
      </g>
    </g>

    <!-- Project 02 Info -->
    <g transform="translate(24, 162)">
      <text x="0" y="0" class="serif accent" font-size="20">02</text>
      <text x="26" y="-2" class="mono stone" font-size="10" letter-spacing="1">/ [2025] — SYSTEMS ARCHITECTURE</text>
      <text x="0" y="28" class="sans bone" font-size="20" font-weight="600" letter-spacing="-0.5">[Project Title 02 — Distributed Telemetry]</text>
      <text x="0" y="52" class="sans stone" font-size="12.5">[Placeholder: High-ingestion time-series analytics pipeline and real-time</text>
      <text x="0" y="70" class="sans stone" font-size="12.5">observability dashboard built with Go, ClickHouse, and Canvas 2D.]</text>
      <text x="0" y="98" class="mono muted" font-size="10">GO  ·  CLICKHOUSE  ·  DOCKER  ·  NEXT.JS</text>
    </g>
  </g>

  <!-- ==================== CASE STUDY 03 (BOTTOM RIGHT) ==================== -->
  <g transform="translate(512, 368)">
    <rect width="456" height="284" rx="10" class="card" />

    <!-- Top Animated UI Mockup: Design System & Shader Controls -->
    <g transform="translate(20, 20)">
      <rect width="416" height="115" rx="6" class="mockup-bg" />
      <text x="14" y="20" class="mono muted" font-size="9.5">DESIGN TOKENS &amp; SHADER COMPILER</text>

      <!-- Animated Parameter Sliders -->
      <g transform="translate(16, 38)">
        <text x="0" y="10" class="mono stone" font-size="9.5">RADIUS</text>
        <line x1="65" y1="6" x2="210" y2="6" stroke="#242320" stroke-width="3" stroke-linecap="round" />
        <circle class="slider-1" cx="85" cy="6" r="5" fill="#f2efe9" />

        <text x="0" y="36" class="mono stone" font-size="9.5">TENSION</text>
        <line x1="65" y1="32" x2="210" y2="32" stroke="#242320" stroke-width="3" stroke-linecap="round" />
        <circle class="slider-2" cx="115" cy="32" r="5" fill="#e04f33" />

        <text x="0" y="62" class="mono stone" font-size="9.5">GRAIN</text>
        <line x1="65" y1="58" x2="210" y2="58" stroke="#242320" stroke-width="3" stroke-linecap="round" />
        <circle class="slider-1" cx="105" cy="58" r="5" fill="#8a857d" />
      </g>

      <!-- Live Morphing Preview Shape on Right of Mockup -->
      <g transform="translate(325, 58)">
        <rect x="-32" y="-32" width="64" height="64" fill="#141412" stroke="#292824" rx="12">
          <animate attributeName="rx" values="6;28;6" dur="4s" repeatCount="indefinite" />
          <animateTransform attributeName="transform" type="rotate" from="0" to="90" dur="8s" repeatCount="indefinite" />
        </rect>
        <circle cx="0" cy="0" r="10" fill="#e04f33" />
      </g>
    </g>

    <!-- Project 03 Info -->
    <g transform="translate(24, 162)">
      <text x="0" y="0" class="serif accent" font-size="20">03</text>
      <text x="26" y="-2" class="mono stone" font-size="10" letter-spacing="1">/ [2024] — DESIGN ENGINEERING</text>
      <text x="0" y="28" class="sans bone" font-size="20" font-weight="600" letter-spacing="-0.5">[Project Title 03 — Tactile UI Primitives]</text>
      <text x="0" y="52" class="sans stone" font-size="12.5">[Placeholder: Accessible, unstyled component library and Figma token</text>
      <text x="0" y="70" class="sans stone" font-size="12.5">compiler powering 12+ internal web applications with zero runtime overhead.]</text>
      <text x="0" y="98" class="mono muted" font-size="10">REACT  ·  CSS PRIMITIVES  ·  WEBGL  ·  FIGMA API</text>
    </g>
  </g>
</svg>
