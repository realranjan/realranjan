<svg viewBox="0 0 1000 540" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');

      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .serif { font-family: 'Instrument Serif', 'Playfair Display', Georgia, 'Times New Roman', serif; font-style: italic; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }

      .bg { fill: #0b0b0a; }
      .surface { fill: #121210; }
      .border { stroke: #242320; stroke-width: 1; fill: none; }
      .divider { stroke: #242320; stroke-width: 1; }

      .bone { fill: #f2efe9; }
      .stone { fill: #8a857d; }
      .muted { fill: #57534e; }
      .accent { fill: #e04f33; }

      .hero-line {
        font-size: 52px;
        font-weight: 500;
        letter-spacing: -2px;
        fill: #f2efe9;
      }
      .hero-serif {
        font-size: 58px;
        font-weight: 400;
        letter-spacing: -0.5px;
      }

      /* Staggered Entrance Animations */
      .fade-1 { opacity: 0; animation: reveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.1s; }
      .fade-2 { opacity: 0; animation: reveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.25s; }
      .fade-3 { opacity: 0; animation: reveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.4s; }
      .fade-4 { opacity: 0; animation: reveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.55s; }

      /* Infinite Marquee */
      .marquee-track {
        animation: marquee 28s linear infinite;
      }

      /* Status Pulse */
      .status-dot {
        fill: #28c840;
        animation: pulse 2.5s ease-in-out infinite;
      }

      @keyframes reveal {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes marquee {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-1000px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
    </style>

    <clipPath id="marquee-clip">
      <rect x="0" y="492" width="1000" height="48" />
    </clipPath>

    <pattern id="micro-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#242320" />
    </pattern>
  </defs>

  <!-- Outer Frame -->
  <rect width="1000" height="540" rx="12" class="bg" />
  <rect x="0.5" y="0.5" width="999" height="539" rx="12" class="border" />

  <!-- ==================== 1. TOP NAVIGATION BAR ==================== -->
  <line x1="0" y1="52" x2="1000" y2="52" class="divider" />
  <g transform="translate(32, 31)">
    <!-- Brand / Name Placeholder -->
    <rect x="0" y="-12" width="14" height="14" rx="3" class="accent" />
    <text x="24" y="0" class="mono bone" font-size="12" font-weight="500" letter-spacing="1">[YOUR NAME]</text>
    <text x="130" y="0" class="mono muted" font-size="11">/ PORTFOLIO.2026</text>

    <!-- Nav Links -->
    <text x="380" y="0" class="mono stone" font-size="11" letter-spacing="1">01. WORK</text>
    <text x="470" y="0" class="mono stone" font-size="11" letter-spacing="1">02. EXPERIENCE</text>
    <text x="600" y="0" class="mono stone" font-size="11" letter-spacing="1">03. STACK</text>
    <text x="695" y="0" class="mono stone" font-size="11" letter-spacing="1">04. CONTACT</text>

    <!-- Live Availability Pill -->
    <g transform="translate(805, -16)">
      <rect width="135" height="24" rx="12" fill="#161614" stroke="#242320" />
      <circle cx="14" cy="12" r="3.5" class="status-dot" />
      <text x="26" y="15.5" class="mono bone" font-size="10" letter-spacing="0.8">OPEN TO ROLES</text>
    </g>
  </g>

  <!-- ==================== 2. LEFT EDITORIAL HERO ==================== -->
  <line x1="650" y1="52" x2="650" y2="492" class="divider" />

  <g transform="translate(40, 105)">
    <g class="fade-1">
      <text x="0" y="0" class="mono accent" font-size="11" letter-spacing="2">DESIGN ENGINEER &amp; FULL-STACK ARCHITECT</text>
    </g>

    <!-- Editorial Mixed-Typography Headline -->
    <g class="fade-2">
      <text x="0" y="62" class="sans hero-line">Crafting <tspan class="serif hero-serif" fill="#f2efe9">tactile</tspan> software</text>
      <text x="0" y="122" class="sans hero-line">&amp; <tspan class="serif hero-serif accent">high-frequency</tspan> web</text>
      <text x="0" y="182" class="sans hero-line">systems.</text>
    </g>

    <!-- Bio Paragraph Placeholder -->
    <g class="fade-3" transform="translate(0, 222)">
      <text x="0" y="0" class="sans stone" font-size="14.5" letter-spacing="-0.1">
        I'm <tspan class="bone" font-weight="500">[Your Name]</tspan>, a developer and interface designer based in <tspan class="bone">[Your City]</tspan>.
      </text>
      <text x="0" y="24" class="sans stone" font-size="14.5" letter-spacing="-0.1">
        I obsess over spring physics, typographic hierarchy, and distributed backend
      </text>
      <text x="0" y="48" class="sans stone" font-size="14.5" letter-spacing="-0.1">
        architecture—turning complex technical problems into effortless tools.
      </text>
    </g>

    <!-- Key Metrics Bar -->
    <g class="fade-4" transform="translate(0, 312)">
      <line x1="0" y1="0" x2="570" y2="0" class="divider" />
      
      <g transform="translate(0, 28)">
        <text x="0" y="0" class="serif bone" font-size="30">[05+]</text>
        <text x="0" y="20" class="mono stone" font-size="10" letter-spacing="1">YEARS EXPERIENCE</text>
      </g>

      <g transform="translate(185, 28)">
        <text x="0" y="0" class="serif bone" font-size="30">[24+]</text>
        <text x="0" y="20" class="mono stone" font-size="10" letter-spacing="1">SYSTEMS SHIPPED</text>
      </g>

      <g transform="translate(370, 28)">
        <text x="0" y="0" class="serif accent" font-size="30">[99.9%]</text>
        <text x="0" y="20" class="mono stone" font-size="10" letter-spacing="1">UPTIME ENGINEERED</text>
      </g>
    </g>
  </g>

  <!-- ==================== 3. RIGHT INTERACTIVE MOTION STUDY ==================== -->
  <g transform="translate(650, 52)">
    <rect width="349" height="440" fill="url(#micro-grid)" />
    
    <!-- Top Spec Header -->
    <g transform="translate(24, 28)">
      <text x="0" y="0" class="mono stone" font-size="10" letter-spacing="1">FIG 0.1 — SPRING PHYSICS OSCILLOSCOPE</text>
      <text x="0" y="16" class="mono muted" font-size="10">stiffness: 280 | damping: 18 | mass: 1.0</text>
    </g>

    <!-- Animated Harmonic Bezier Curves -->
    <g transform="translate(25, 85)">
      <rect width="300" height="230" rx="8" fill="#0e0e0c" stroke="#242320" />
      
      <!-- Reference Axis Lines -->
      <line x1="0" y1="115" x2="300" y2="115" stroke="#1f1e1b" stroke-dasharray="4 4" />
      <line x1="150" y1="0" x2="150" y2="230" stroke="#1f1e1b" stroke-dasharray="4 4" />

      <!-- Secondary Harmonic Wave -->
      <path fill="none" stroke="#57534e" stroke-width="1.2" opacity="0.6">
        <animate attributeName="d" dur="6s" repeatCount="indefinite"
          values="M 15,115 C 85,20 135,210 285,115;
                  M 15,115 C 85,210 135,20 285,115;
                  M 15,115 C 85,20 135,210 285,115" />
      </path>

      <!-- Primary Vermilion Spring Wave -->
      <path fill="none" stroke="#e04f33" stroke-width="2">
        <animate attributeName="d" dur="4s" repeatCount="indefinite"
          values="M 15,115 C 75,15 155,215 285,115;
                  M 15,115 C 75,215 155,15 285,115;
                  M 15,115 C 75,15 155,215 285,115" />
      </path>

      <!-- Ivory Phase Wave -->
      <path fill="none" stroke="#f2efe9" stroke-width="1.5">
        <animate attributeName="d" dur="5s" repeatCount="indefinite"
          values="M 15,115 C 110,195 190,35 285,115;
                  M 15,115 C 110,35 190,195 285,115;
                  M 15,115 C 110,195 190,35 285,115" />
      </path>

      <!-- Animated Control Handle Line & Node -->
      <circle r="4.5" fill="#e04f33" stroke="#0b0b0a" stroke-width="2">
        <animate attributeName="cx" values="75;155;75" dur="4s" repeatCount="indefinite" />
        <animate attributeName="cy" values="65;165;65" dur="4s" repeatCount="indefinite" />
      </circle>
      <circle r="4" fill="#f2efe9">
        <animate attributeName="cx" values="190;110;190" dur="5s" repeatCount="indefinite" />
        <animate attributeName="cy" values="75;155;75" dur="5s" repeatCount="indefinite" />
      </circle>

      <!-- Live Telemetry Readout inside Oscilloscope -->
      <text x="14" y="214" class="mono muted" font-size="9.5">60.0 FPS // CUBIC-BEZIER(0.22, 1, 0.36, 1)</text>
    </g>

    <!-- Bottom Location / Timezone Card -->
    <g transform="translate(25, 335)">
      <rect width="300" height="80" rx="8" class="surface" stroke="#242320" />
      <text x="18" y="28" class="mono stone" font-size="10" letter-spacing="1">BASE OF OPERATIONS</text>
      <text x="18" y="50" class="sans bone" font-size="14" font-weight="500">[City, Country] — [UTC Offset]</text>
      <text x="18" y="66" class="mono muted" font-size="10">REMOTE &amp; ON-SITE READY</text>
    </g>
  </g>

  <!-- ==================== 4. INFINITE DISCIPLINE MARQUEE ==================== -->
  <line x1="0" y1="492" x2="1000" y2="492" class="divider" />
  <g clip-path="url(#marquee-clip)">
    <rect x="0" y="492" width="1000" height="48" fill="#0e0e0c" />
    <g class="marquee-track" transform="translate(0, 520)">
      <text x="0" y="0" class="mono stone" font-size="11" letter-spacing="2.5">
        INTERFACE ARCHITECTURE  ✦  DESIGN SYSTEMS  ✦  FULL-STACK TYPESCRIPT  ✦  REACT &amp; NEXT.JS  ✦  DISTRIBUTED APIS  ✦  RUST &amp; GO  ✦  WEBGL &amp; SHADERS  ✦  PERFORMANCE ENGINEERING  ✦  INTERFACE ARCHITECTURE  ✦  DESIGN SYSTEMS  ✦  FULL-STACK TYPESCRIPT  ✦  REACT &amp; NEXT.JS  ✦  DISTRIBUTED APIS  ✦  RUST &amp; GO  ✦
      </text>
    </g>
  </g>
</svg>
